    <!-- SCHERMATA LOGIN / NOME CLIENTE -->

            <div class="text-center mb-6">

                    <i class="fa-solid fa-utensils"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-900">Benvenuto!</h2>

            </div>
            <form id="user-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Il tuo Nome *</label>
                    <input type="text" id="client-name" required placeholder="Es. Mario Rossi" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-orange-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Tavolo / Riferimento Asporto (Opzionale)</label>

                </div>
                <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-orange-600/30">
                    Entra nel Menu
                </button>
            </form>
            <div class="mt-6 border-t pt-4 text-center">
                <button onclick="switchToRegia()" class="text-xs text-gray-400 hover:text-gray-600 underline">
                    Sei lo staff? Accedi alla Regia
                </button>
            </div>
        </div>
    </div>

    <!-- APP PRINCIPALE -->

                    </button>
                    <button onclick="switchToRegia()" class="bg-gray-800 text-white px-3 py-2 rounded-xl text-xs font-semibold hover:bg-gray-900 transition">

            </div>

    <!-- MODALE CARRELLO -->

        </div>

    <div id="variation-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">

            <div class="mb-4">

            menuData.forEach((cat, index) => {
                const btn = document.createElement("button");
                btn.className = `px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition ${index === activeCategoryIndex ? 'bg-orange-600 text-white shadow-md' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'}`;
                btn.innerText = cat.category;
                btn.onclick = () => { activeCategoryIndex = index; initMenu(); };
                nav.appendChild(btn);
            });

            renderProducts(activeCategoryIndex);
        }

        function renderProducts(catIndex) {
            const container = document.getElementById("products-container");
            container.innerHTML = "";
            const cat = menuData[catIndex];

            cat.items.forEach((item, itemIndex) => {
                const card = document.createElement("div");
                card.className = "bg-white p-4 rounded-2xl border border-gray-200 shadow-sm flex flex-col justify-between hover:shadow-md transition";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-1">
                            <h3 class="font-bold text-gray-900">${item.name}</h3>
                            <span class="bg-orange-50 text-orange-600 font-bold px-2.5 py-1 rounded-lg text-sm">€ ${item.price.toFixed(2)}</span>
                        </div>
                        <p class="text-xs text-gray-500 mb-4">${item.desc}</p>
                    </div>
                    <button onclick="openVariationModal(${catIndex}, ${itemIndex})" class="w-full bg-orange-50 hover:bg-orange-600 hover:text-white text-orange-600 border border-orange-200 font-semibold py-2.5 rounded-xl text-sm transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-plus"></i> <span>Aggiungi / Quantità / Variazioni</span>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function openVariationModal(catIdx, itemIdx) {
            currentSelectedProduct = menuData[catIdx].items[itemIdx];
            document.getElementById("modal-product-title").innerText = currentSelectedProduct.name;
            document.getElementById("modal-product-price").innerText = `€ ${currentSelectedProduct.price.toFixed(2)} cad.`;
            document.getElementById("product-qty").value = 1;
            document.getElementById("product-notes").value = "";
            document.getElementById("variation-modal").classList.remove("hidden");
        }

        function closeVariationModal() {
            document.getElementById("variation-modal").classList.add("hidden");
            currentSelectedProduct = null;
        }

        function incrementQty() {
            const input = document.getElementById("product-qty");
            input.value = parseInt(input.value || 1) + 1;
        }

        function decrementQty() {
            const input = document.getElementById("product-qty");
            let val = parseInt(input.value || 1) - 1;
            if (val < 1) val = 1;
            input.value = val;
        }

        function confirmAddToCart() {
            const qty = parseInt(document.getElementById("product-qty").value) || 1;
            const notes = document.getElementById("product-notes").value.trim();

            cart.push({
                ...currentSelectedProduct,
                qty: qty,
                notes: notes || "Nessuna variazione"
            });
            updateCartCount();
            closeVariationModal();
        }

        function updateCartCount() {
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById("cart-count").innerText = totalItems;
        }

        function openCart() {
            const container = document.getElementById("cart-items");
            container.innerHTML = "";
            let total = 0;

            if(cart.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-10">Il tuo carrello è vuoto</p>`;
            } else {
                cart.forEach((item, index) => {
                    const subtotal = item.price * item.qty;
                    total += subtotal;
                    const div = document.createElement("div");
                    div.className = "bg-gray-50 p-3 rounded-xl border border-gray-200 flex justify-between items-center";
                    div.innerHTML = `
                        <div>
                            <h4 class="font-bold text-sm text-gray-900">${item.qty}x ${item.name}</h4>
                            <p class="text-xs text-orange-600 font-medium">Note: ${item.notes}</p>
                            <p class="text-xs font-bold text-gray-700 mt-1">€ ${subtotal.toFixed(2)}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="decreaseCartItem(${index})" class="bg-gray-200 hover:bg-gray-300 text-gray-800 w-7 h-7 rounded-lg font-bold text-sm">-</button>
                            <span class="text-sm font-bold">${item.qty}</span>
                            <button onclick="increaseCartItem(${index})" class="bg-gray-200 hover:bg-gray-300 text-gray-800 w-7 h-7 rounded-lg font-bold text-sm">+</button>
                            <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 ml-2 p-1"><i class="fa-solid fa-trash text-sm"></i></button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }

            document.getElementById("cart-total").innerText = `€ ${total.toFixed(2)}`;
            document.getElementById("cart-modal").classList.remove("hidden");
        }

        function closeCart() {
            document.getElementById("cart-modal").classList.add("hidden");
        }

        function increaseCartItem(index) {
            cart[index].qty++;
            updateCartCount();
            openCart();
        }

        function decreaseCartItem(index) {
            cart[index].qty--;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            updateCartCount();
            openCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartCount();
            openCart();
        }

        function submitOrder() {
            if(cart.length === 0) return alert("Il carrello è vuoto!");

            const newOrder = {
                id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                client: currentUser.name,
                table: currentUser.table,
                items: [...cart],
                total: cart.reduce((sum, item) => sum + (item.price * item.qty), 0),
                status: 'In attesa',
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            let orders = JSON.parse(localStorage.getItem('restaurant_orders') || '[]');
            orders.unshift(newOrder);
            localStorage.setItem('restaurant_orders', JSON.stringify(orders));

            cart = [];
            updateCartCount();
            closeCart();
            alert("Ordine inviato con successo alla Regia!");
        }

        function loadRegiaOrders() {
            const grid = document.getElementById("orders-grid");
            const orders = JSON.parse(localStorage.getItem('restaurant_orders') || '[]');

            if(orders.length === 0) {
                grid.innerHTML = `<p class="text-center text-gray-400 col-span-full py-12">Nessun ordine ricevuto al momento.</p>`;
                return;
            }

            grid.innerHTML = "";
            orders.forEach((order, index) => {
                const card = document.createElement("div");
                card.className = "bg-white rounded-2xl shadow-sm border border-gray-200 p-4 flex flex-col justify-between";
                
                let itemsHtml = order.items.map(i => `
                    <div class="text-sm py-1 border-b border-gray-100 last:border-none">
                        <div class="flex justify-between font-semibold text-gray-800">
                            <span>${i.qty}x ${i.name}</span>
                            <span>€ ${(i.price * i.qty).toFixed(2)}</span>
                        </div>
                        <p class="text-xs text-orange-600 bg-orange-50 px-2 py-0.5 rounded mt-1 inline-block">Var: ${i.notes}</p>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="text-xs font-bold text-gray-400">${order.id} - ${order.time}</span>
                                <h3 class="font-bold text-lg text-gray-900">${order.client}</h3>
                                <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full font-medium">${order.table}</span>
                            </div>
                            <select onchange="updateOrderStatus(${index}, this.value)" class="text-xs font-semibold px-2.5 py-1.5 rounded-xl border border-gray-300 bg-white focus:outline-none">
                                <option value="In attesa" ${order.status === 'In attesa' ? 'selected' : ''}>In attesa</option>
                                <option value="In preparazione" ${order.status === 'In preparazione' ? 'selected' : ''}>In preparazione</option>
                                <option value="Pronto" ${order.status === 'Pronto' ? 'selected' : ''}>Pronto</option>
                                <option value="Inviato" ${order.status === 'Inviato' ? 'selected' : ''}>Inviato</option>
                            </select>
                        </div>
                        <div class="my-3 space-y-1 bg-gray-50 p-3 rounded-xl max-h-40 overflow-y-auto">
                            ${itemsHtml}
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between font-bold text-gray-900 mb-3 pt-2 border-t">
                            <span>Totale Ordine:</span>
                            <span class="text-orange-600">€ ${order.total.toFixed(2)}</span>
                        </div>
                        <button onclick="sendOrderToWhatsApp('${order.id}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-sm">
                            <i class="fa-brands fa-whatsapp text-lg"></i> Invia a WhatsApp
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateOrderStatus(index, newStatus) {
            let orders = JSON.parse(localStorage.getItem('restaurant_orders') || '[]');
            orders[index].status = newStatus;
            localStorage.setItem('restaurant_orders', JSON.stringify(orders));
        }

        function sendOrderToWhatsApp(orderId) {
            let orders = JSON.parse(localStorage.getItem('restaurant_orders') || '[]');
            let order = orders.find(o => o.id === orderId);
            if(!order) return;

            let text = `*NUOVO ORDINE ASPORTO*%0A`;
            text += `ID: ${order.id}%0A`;
            text += `Cliente: *${order.client}* (${order.table})%0A`;
            text += `Ora: ${order.time}%0A%0A`;
            text += `*Prodotti:*%0A`;
            order.items.forEach(i => {
                text += `- ${i.qty}x ${i.name} (€ ${(i.price * i.qty).toFixed(2)})%0A  _Note: ${i.notes}_%0A`;
            });
            text += `%0A*Totale: € ${order.total.toFixed(2)}*`;

            window.open(`https://wa.me/${WHATSAPP_REGIA_NUMBER}?text=${text}`, '_blank');
        }

        setInterval(() => {
            if(!document.getElementById("regia-app").classList.contains("hidden")) {
                loadRegiaOrders();
            }
        }, 2000);
    </script>
</body>
</html>
