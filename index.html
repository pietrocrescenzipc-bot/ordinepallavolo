    <!-- SCHERMATA LOGIN / NOME CLIENTE -->

            </div>
            <form id="user-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">Il tuo Nome *</label>
                    <input type="text" id="client-name" required placeholder="Es. Mario Rossi" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-orange-500 focus:outline-none font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">Tavolo / Riferimento (Opzionale)</label>
                    <input type="text" id="client-table" placeholder="Es. Asporto ore 20:30" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-orange-500 focus:outline-none font-medium">
                </div>
                <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-4 rounded-xl transition shadow-lg shadow-orange-600/30">
                    Accedi al Menu
                </button>
            </form>
            <div class="mt-6 border-t pt-4 text-center">
                <button onclick="switchToRegia()" class="text-xs font-semibold text-gray-400 hover:text-gray-700 underline">
                    🔒 Accesso Staff / Regia Cucina
                </button>
            </div>
        </div>
    </div>

                            <i class="fa-solid fa-fire"></i> Ordini Asporto

                </div>
                <div class="flex items-center gap-2">

                    </button>
                    <button onclick="switchToRegia()" class="bg-gray-900 text-white px-3 py-2 rounded-xl text-xs font-bold hover:bg-gray-800 transition">

            </div>

    <!-- MODALE RIEPILOGO CARRELLO -->
    <div id="cart-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex justify-end">

            </div>

            </div>
            <div class="p-4 border-t bg-gray-50 space-y-3">

        </div>

    <!-- MODALE QUANTITA' E VARIAZIONI -->
    <div id="variation-modal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4">

                <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">Quantità</label>
                <div class="flex items-center gap-3">

                </div>
            </div>

            },
            {
                category: "Vini, Amari & Caffè",
                items: [
                    { name: "Refosco dal Peduncolo (0,375 l)", price: 7.00, desc: "Antonutti 1921 - Friuli Grave" },
                    { name: "Refosco dal Peduncolo (0,75 l)", price: 15.00, desc: "Antonutti 1921 - Friuli Grave" },
                    { name: "Ribolla Gialla (0,375 l)", price: 7.00, desc: "Antonutti 1921 - Friuli Grave" },
                    { name: "Ribolla Gialla (0,75 l)", price: 15.00, desc: "Antonutti 1921 - Friuli Grave" },
                    { name: "Sauvignon (0,375 l)", price: 7.00, desc: "Antonutti 1921 - Friuli Grave" },
                    { name: "Sauvignon (0,75 l)", price: 15.00, desc: "Antonutti 1921 - Friuli Grave" },
                    { name: "Traminer Aromatico (0,375 l)", price: 7.00, desc: "Antonutti 1921 - Friuli Grave" },
                    { name: "Traminer Aromatico (0,75 l)", price: 15.00, desc: "Antonutti 1921 - Friuli Grave" },
                    { name: "AMARI", price: 3.50, desc: "Selezione di amari" },
                    { name: "Grappa", price: 4.00, desc: "Grappa barricata/bianca" },
                    { name: "Caffè espresso", price: 1.50, desc: "Caffè espresso italiano" }
                ]
            }
        ];

        let currentUser = { name: "", table: "" };
        let cart = [];
        let currentSelectedProduct = null;
        let activeCategoryIndex = 0;

        document.getElementById("user-form").addEventListener("submit", function(e) {
            e.preventDefault();
            const name = document.getElementById("client-name").value.trim();
            const table = document.getElementById("client-table").value.trim();
            if(!name) return;

            currentUser = { name, table: table || "Asporto" };
            document.getElementById("display-client-name").innerText = `${currentUser.name} (${currentUser.table})`;
            
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("main-app").classList.remove("hidden");
            
            initApp();
        });

        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const overlay = document.getElementById("sidebar-overlay");
            sidebar.classList.toggle("-translate-x-full");
            overlay.classList.toggle("hidden");
        }

        function switchToRegia() {
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("main-app").classList.add("hidden");
            document.getElementById("regia-app").classList.remove("hidden");
            loadRegiaOrders();
        }

        function switchToClient() {
            document.getElementById("regia-app").classList.add("hidden");
            document.getElementById("main-app").classList.remove("hidden");
        }

        function initApp() {
            renderSidebar();
            renderProducts(activeCategoryIndex);
        }

        function renderSidebar() {
            const list = document.getElementById("category-list");
            list.innerHTML = "";
            menuData.forEach((cat, index) => {
                const btn = document.createElement("button");
                btn.className = `w-full text-left px-4 py-3 rounded-xl text-sm font-bold transition flex justify-between items-center ${index === activeCategoryIndex ? 'bg-orange-600 text-white shadow-md' : 'text-gray-600 hover:bg-gray-100'}`;
                btn.innerHTML = `<span>${cat.category}</span> <i class="fa-solid fa-chevron-right text-xs opacity-60"></i>`;
                btn.onclick = () => {
                    activeCategoryIndex = index;
                    renderSidebar();
                    renderProducts(index);
                    if(window.innerWidth < 768) toggleSidebar();
                };
                list.appendChild(btn);
            });
        }

        function renderProducts(catIndex) {
            const container = document.getElementById("products-container");
            const cat = menuData[catIndex];
            document.getElementById("current-category-title").innerText = cat.category;
            container.innerHTML = "";

            cat.items.forEach((item, itemIndex) => {
                const card = document.createElement("div");
                card.className = "bg-white p-5 rounded-2xl border border-gray-200 shadow-sm flex flex-col justify-between hover:shadow-md hover:border-orange-200 transition cursor-pointer";
                card.onclick = () => openVariationModal(catIndex, itemIndex);
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <h3 class="font-black text-gray-900 text-base">${item.name}</h3>
                            <span class="bg-orange-50 text-orange-600 font-black px-3 py-1 rounded-xl text-sm whitespace-nowrap">€ ${item.price.toFixed(2)}</span>
                        </div>
                        <p class="text-xs text-gray-500 leading-relaxed mb-4">${item.desc}</p>
                    </div>
                    <div class="w-full bg-gray-50 group-hover:bg-orange-600 group-hover:text-white text-orange-600 font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2 border border-orange-100">
                        <i class="fa-solid fa-plus-circle text-sm"></i> <span>Aggiungi / Variazioni</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openVariationModal(catIdx, itemIdx) {
            currentSelectedProduct = menuData[catIdx].items[itemIdx];
            document.getElementById("modal-product-title").innerText = currentSelectedProduct.name;
            document.getElementById("modal-product-price").innerText = `Prezzo unitario: € ${currentSelectedProduct.price.toFixed(2)}`;
            document.getElementById("product-qty").value = 1;
            document.getElementById("product-notes").value = "";
            document.getElementById("variation-modal").classList.remove("hidden");
        }

        function closeVariationModal() {
            document.getElementById("variation-modal").classList.add("hidden");
            currentSelectedProduct = null;
        }

        function incrementQty() {
            const input = document.getElementById("product-qty");
            input.value = parseInt(input.value || 1) + 1;
        }

        function decrementQty() {
            const input = document.getElementById("product-qty");
            let val = parseInt(input.value || 1) - 1;
            if (val < 1) val = 1;
            input.value = val;
        }

        function confirmAddToCart() {
            const qty = parseInt(document.getElementById("product-qty").value) || 1;
            const notes = document.getElementById("product-notes").value.trim();

            cart.push({
                ...currentSelectedProduct,
                qty: qty,
                notes: notes || "Nessuna variazione"
            });
            updateCartCount();
            closeVariationModal();
        }

        function updateCartCount() {
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById("cart-count").innerText = totalItems;
        }

        function openCart() {
            const container = document.getElementById("cart-items");
            container.innerHTML = "";
            let total = 0;

            if(cart.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-400 py-12 font-medium">Il tuo carrello è vuoto</p>`;
            } else {
                cart.forEach((item, index) => {
                    const subtotal = item.price * item.qty;
                    total += subtotal;
                    const div = document.createElement("div");
                    div.className = "bg-gray-50 p-3.5 rounded-2xl border border-gray-200 flex justify-between items-center";
                    div.innerHTML = `
                        <div class="flex-1 pr-2">
                            <h4 class="font-black text-sm text-gray-900">${item.qty}x ${item.name}</h4>
                            <p class="text-xs text-orange-600 font-bold mt-0.5">Nota: ${item.notes}</p>
                            <p class="text-xs font-bold text-gray-700 mt-1">€ ${subtotal.toFixed(2)}</p>
                        </div>
                        <div class="flex items-center gap-1.5 bg-white p-1 rounded-xl border border-gray-200 shadow-sm">
                            <button onclick="decreaseCartItem(${index})" class="bg-gray-100 hover:bg-gray-200 text-gray-800 w-7 h-7 rounded-lg font-black text-xs">-</button>
                            <span class="text-xs font-black px-1">${item.qty}</span>
                            <button onclick="increaseCartItem(${index})" class="bg-gray-100 hover:bg-gray-200 text-gray-800 w-7 h-7 rounded-lg font-black text-xs">+</button>
                            <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 ml-1 p-1"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }

            document.getElementById("cart-total").innerText = `€ ${total.toFixed(2)}`;
            document.getElementById("cart-modal").classList.remove("hidden");
        }

        function closeCart() {
            document.getElementById("cart-modal").classList.add("hidden");
        }

        function increaseCartItem(index) {
            cart[index].qty++;
            updateCartCount();
            openCart();
        }

        function decreaseCartItem(index) {
            cart[index].qty--;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            updateCartCount();
            openCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartCount();
            openCart();
        }

        function submitOrder() {
            if(cart.length === 0) return alert("Il carrello è vuoto!");

            const newOrder = {
                id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                client: currentUser.name,
                table: currentUser.table,
                items: [...cart],
                total: cart.reduce((sum, item) => sum + (item.price * item.qty), 0),
                status: 'In attesa',
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            let orders = JSON.parse(localStorage.getItem('restaurant_orders') || '[]');
            orders.unshift(newOrder);
            localStorage.setItem('restaurant_orders', JSON.stringify(orders));

            cart = [];
            updateCartCount();
            closeCart();
            alert("Ordine inviato con successo alla Regia!");
        }

        function loadRegiaOrders() {
            const grid = document.getElementById("orders-grid");
            const orders = JSON.parse(localStorage.getItem('restaurant_orders') || '[]');

            if(orders.length === 0) {
                grid.innerHTML = `<p class="text-center text-gray-400 col-span-full py-12 font-medium">Nessun ordine ricevuto al momento.</p>`;
                return;
            }

            grid.innerHTML = "";
            orders.forEach((order, index) => {
                const card = document.createElement("div");
                card.className = "bg-white rounded-3xl shadow-sm border border-gray-200 p-5 flex flex-col justify-between";
                
                let itemsHtml = order.items.map(i => `
                    <div class="text-sm py-1.5 border-b border-gray-100 last:border-none">
                        <div class="flex justify-between font-bold text-gray-800">
                            <span>${i.qty}x ${i.name}</span>
                            <span>€ ${(i.price * i.qty).toFixed(2)}</span>
                        </div>
                        <p class="text-xs text-orange-600 bg-orange-50 px-2 py-0.5 rounded-lg mt-1 inline-block font-semibold">Var: ${i.notes}</p>
                    </div>
                `).join('');

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <span class="text-xs font-black text-gray-400">${order.id} • ${order.time}</span>
                                <h3 class="font-black text-lg text-gray-900">${order.client}</h3>
                                <span class="text-xs bg-gray-100 text-gray-600 px-2.5 py-0.5 rounded-full font-bold">${order.table}</span>
                            </div>
                            <select onchange="updateOrderStatus(${index}, this.value)" class="text-xs font-bold px-3 py-2 rounded-xl border border-gray-300 bg-white focus:outline-none shadow-sm">
                                <option value="In attesa" ${order.status === 'In attesa' ? 'selected' : ''}>In attesa</option>
                                <option value="In preparazione" ${order.status === 'In preparazione' ? 'selected' : ''}>In preparazione</option>
                                <option value="Pronto" ${order.status === 'Pronto' ? 'selected' : ''}>Pronto</option>
                                <option value="Inviato" ${order.status === 'Inviato' ? 'selected' : ''}>Inviato</option>
                            </select>
                        </div>
                        <div class="my-3 space-y-1 bg-gray-50 p-3.5 rounded-2xl max-h-48 overflow-y-auto">
                            ${itemsHtml}
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between font-black text-gray-900 mb-3 pt-3 border-t">
                            <span>Totale:</span>
                            <span class="text-orange-600 text-lg">€ ${order.total.toFixed(2)}</span>
                        </div>
                        <button onclick="sendOrderToWhatsApp('${order.id}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-md">
                            <i class="fa-brands fa-whatsapp text-lg"></i> Invia a WhatsApp
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function updateOrderStatus(index, newStatus) {
            let orders = JSON.parse(localStorage.getItem('restaurant_orders') || '[]');
            orders[index].status = newStatus;
            localStorage.setItem('restaurant_orders', JSON.stringify(orders));
        }

        function sendOrderToWhatsApp(orderId) {
            let orders = JSON.parse(localStorage.getItem('restaurant_orders') || '[]');
            let order = orders.find(o => o.id === orderId);
            if(!order) return;

            let text = `*NUOVO ORDINE ASPORTO*%0A`;
            text += `ID: ${order.id}%0A`;
            text += `Cliente: *${order.client}* (${order.table})%0A`;
            text += `Ora: ${order.time}%0A%0A`;
            text += `*Prodotti:*%0A`;
            order.items.forEach(i => {
                text += `- ${i.qty}x ${i.name} (€ ${(i.price * i.qty).toFixed(2)})%0A  _Note: ${i.notes}_%0A`;
            });
            text += `%0A*Totale: € ${order.total.toFixed(2)}*`;

            window.open(`https://wa.me/${WHATSAPP_REGIA_NUMBER}?text=${text}`, '_blank');
        }

        setInterval(() => {
            if(!document.getElementById("regia-app").classList.contains("hidden")) {
                loadRegiaOrders();
            }
        }, 2000);
    </script>
